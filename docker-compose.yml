services:
  crimpy-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crimpy-frontend
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.crimpy-frontend.rule=Host(`crimpy.app`)
      - traefik.http.routers.crimpy-frontend.entrypoints=websecure
      - traefik.http.routers.crimpy-frontend.tls.certresolver=dnsResolver
    expose:
      - 3000
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - PUBLIC_API_URL=https://api.crimpy.app
    networks:
      - proxy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proxy:
    external: true
