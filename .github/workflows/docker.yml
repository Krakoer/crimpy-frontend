name: Build and push frontend image

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml

  # Nothing in this repo changes when the backend adds an override key, so an
  # image built off an unchanged main is the one path that could ship a portal
  # whose merge drops one. The question is narrower than the one the PR job asks:
  # not whether the vendored list is the current one, but whether this image
  # reads every key the deployed backend can send. The backend deploys from main,
  # and this portal running ahead of it is normal.
  #
  # It compares the key sets and not the merge, which the unit tests own.
  #
  # 200 compares. Anything else is red, including a 404: the contract has been on
  # main since it was released there, so a miss now means the ref moved, the file
  # moved, or crimpy-backend is unreachable, and a gate that cannot see what it
  # guards does not pass.
  contract:
    name: Deployed override keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the deployed backend sends no override key this image drops
        run: |
          CONTRACT=contract/override-keys.json
          BASE=https://raw.githubusercontent.com/Krakoer/crimpy-backend
          REF=main
          URL=$BASE/$REF/$CONTRACT
          trap 'rm -f deployed.json' EXIT
          code=$(curl -sSL --retry 3 --retry-all-errors -o deployed.json -w '%{http_code}' "$URL") || code=000
          if [ "$code" != "200" ]; then
            echo "Could not read $URL (HTTP ${code:-000})." >&2
            echo "000 means the fetch never landed, so the contract itself may be fine." >&2
            echo "A 404 cannot tell a moved ref from a moved or deleted file, so check the ref" >&2
            echo "in the URL above before restoring anything in crimpy-backend." >&2
            exit 1
          fi
          if ! jq -e --slurpfile deployed deployed.json -n \
            '$deployed[0].keys | type == "array" and length > 0 and all(.[]; .key | type == "string" and length > 0)' \
            >/dev/null 2>&1; then
            echo "$URL did not answer the contract: .keys is not a non-empty array of entries" >&2
            echo "each carrying a non-empty string key, so there is no deployed key set to read." >&2
            echo "An error page served with a 200 looks like this, and so does a contract whose" >&2
            echo "entries lost the key field, which the comparison below cannot tell from a" >&2
            echo "backend that drops every key." >&2
            exit 1
          fi
          missing=$(jq -rn \
            --slurpfile deployed deployed.json \
            --slurpfile vendored "$CONTRACT" \
            '[$deployed[0].keys[].key] - [$vendored[0].keys[].key] | join(", ")')
          if [ -n "$missing" ]; then
            echo "the deployed backend sends override keys this image drops: $missing" >&2
            echo "Vendor contract/override-keys.json from crimpy-backend and read them in" >&2
            echo "applyItemOverride, diffItem, overrideSummary and resetItemToBase." >&2
            exit 1
          fi

  docker:
    needs: [e2e, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: krakoer/crimpy-frontend
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
