name: Build and push frontend image

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml

  # Nothing in this repo changes when the backend adds an override key, so an
  # image built off an unchanged main is the one path that could ship a portal
  # whose merge drops one. The question is narrower than the one the PR job asks:
  # not whether the vendored list is the current one, but whether this image
  # reads every key the deployed backend can send. The backend deploys from main,
  # and this portal running ahead of it is normal.
  #
  # It compares the key sets and not the merge, which the unit tests own.
  #
  # A 404 means the backend has not released the contract to main yet, so there is
  # nothing to compare against and the job passes. That is sound because the list
  # was written from the itemOverride struct the deployed backend already ships: a
  # backend older than the file names no key this image is missing.
  #
  # A 404 is also what a moved file, a renamed path, a deleted one, a wrong ref
  # and a typo in the repo return, and those have to stay red. So the pass is
  # taken only once two probes answer 200: go.mod on the same ref, which proves
  # the repo and the ref resolve, and the contract path on dev, which proves the
  # file still lives where the PR check holds the vendored copy to it. One BASE
  # builds all three URLs, so the ref is the only token they do not share. Any
  # other status, and a fetch that never got one, is red either way.
  contract:
    name: Deployed override keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the deployed backend sends no override key this image drops
        run: |
          CONTRACT=contract/override-keys.json
          BASE=https://raw.githubusercontent.com/Krakoer/crimpy-backend
          REF=main
          URL=$BASE/$REF/$CONTRACT
          trap 'rm -f deployed.json' EXIT
          code=$(curl -sSL --retry 3 --retry-all-errors -o deployed.json -w '%{http_code}' "$URL") || code=000
          if [ "$code" = "404" ]; then
            ref_code=$(curl -sSL --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' "$BASE/$REF/go.mod") || ref_code=000
            path_code=$(curl -sSL --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' "$BASE/dev/$CONTRACT") || path_code=000
            if [ "$ref_code" != "200" ] || [ "$path_code" != "200" ]; then
              echo "$URL is missing and this gate cannot tell why." >&2
              echo "$BASE/$REF/go.mod answered ${ref_code:-000}, $BASE/dev/$CONTRACT answered ${path_code:-000}," >&2
              echo "and both have to answer 200 for the miss to mean the backend simply has not" >&2
              echo "released the contract yet. So the ref moved, the contract moved, the URL is" >&2
              echo "wrong, or crimpy-backend is unreachable. A gate that cannot see what it guards" >&2
              echo "does not pass." >&2
              exit 1
            fi
            echo "::warning::crimpy-backend $REF carries no $CONTRACT yet, so this image was not compared against the deployed key set"
            echo "The deployed backend predates the override key contract, so there is nothing"
            echo "to compare against and no key it can send this image drops."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "Could not read $URL (HTTP ${code:-000})." >&2
            echo "Either the fetch failed, or the canonical list is gone from crimpy-backend," >&2
            echo "which is where it lives and where it has to be restored." >&2
            exit 1
          fi
          if ! jq -e '.keys | type == "array"' deployed.json >/dev/null 2>&1; then
            echo "$URL did not answer the contract: no keys array, so the deployed key set" >&2
            echo "could not be read. An error page served with a 200 looks like this." >&2
            exit 1
          fi
          missing=$(jq -rn \
            --slurpfile deployed deployed.json \
            --slurpfile vendored "$CONTRACT" \
            '[$deployed[0].keys[].key] - [$vendored[0].keys[].key] | join(", ")')
          if [ -n "$missing" ]; then
            echo "the deployed backend sends override keys this image drops: $missing" >&2
            echo "Vendor contract/override-keys.json from crimpy-backend and read them in" >&2
            echo "applyItemOverride, diffItem, overrideSummary and resetItemToBase." >&2
            exit 1
          fi

  docker:
    needs: [e2e, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: krakoer/crimpy-frontend
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
